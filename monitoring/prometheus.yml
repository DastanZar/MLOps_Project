global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mlops-fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fastapi-app:8005']
    scrape_interval: 15s
